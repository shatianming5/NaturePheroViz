weights:
  visual_form: 0.5
  data_fidelity: 0.5
  series_cohesion: 0.3

visual_checks:
  need_title: true
  need_labels: true
  need_legend_if_multi: true
  min_contrast: 0.12
  allow_grid: true
  broken_axis_mark: true

data_checks:
  require_columns: true
  positive_on_log: true
  y_breaks_reasonable: true
  colorbar_if_heatmap: true
  non_empty_plot: true

cohesion_checks:
  require_legend_if_multi_series: true
  distinct_series_styles: true
  consistent_x_across_overlays: true
  separate_ratio_axes: true
